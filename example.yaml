# Olimex ESP32-POE-ISO (LAN8720). Adjust the ethernet block for your board.
substitutions:
  name: lldp-test
  idf_version: recommended

esphome:
  name: ${name}

esp32:
  board: esp32-poe-iso
  framework:
    type: esp-idf
    version: ${idf_version}

external_components:
  - source:
      type: local
      path: components
  # or, once pushed to GitHub:
  # - source: github://davidcoulson/esphome-lldp@v0.2.1
  #   components: [lldp]

logger:
api:
ota:
  - platform: esphome

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

lldp:
  # All optional:
  # port_id: eth0
  # port_description: Ethernet
  # system_name: lldp-test        # default: esphome.name
  # system_description: ...       # default: "ESPHome <version> <board>"
  # tx_interval: 30s
  # tx_hold: 4
  # tx_fast_count: 4
  # transmit: true
  # receive: true
  # promiscuous: false            # set true on W5500 / SPI chips without multicast filters
  mdns: true                      # add lldp_switch/lldp_port/lldp_vlan to the _esphomelib mDNS TXT record
  on_neighbor:
    - logger.log:
        format: "Plugged into %s port %s"
        args: [x.system_name, x.port_id]
  on_neighbor_lost:
    - logger.log: "LLDP neighbor gone"

text_sensor:
  - platform: lldp
    system_name:
      name: Switch
    port_id:
      name: Switch port
    port_description:
      name: Switch port description
    chassis_id:
      name: Switch chassis ID
    management_address:
      name: Switch address
    system_description:
      name: Switch description
    capabilities:
      name: Switch capabilities

sensor:
  - platform: lldp
    vlan_id:
      name: Port VLAN

binary_sensor:
  - platform: lldp
    neighbor_present:
      name: LLDP neighbor
